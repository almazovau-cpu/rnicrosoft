<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Геолокация — проект</title>

  <link rel="stylesheet" href="re.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="" />
</head>
<body>
  <main class="card">
    <section class="left">
      <h1>📍 Геолокация — Школьный проект</h1>
      <p class="lead">Нажмите кнопку — браузер запросит разрешение. Работает на телефонах по HTTPS.</p>

      <div class="controls">
        <button id="btnGet">Получить местоположение</button>
        <button id="btnWatch" class="ghost">Начать наблюдение</button>
        <button id="btnStop" class="ghost" disabled>Остановить</button>
      </div>

      <div id="result">Нажмите кнопку выше.</div>
      <p class="note">Чтобы работало на iPhone — загрузи на GitHub Pages или Netlify.</p>
    </section>

    <aside class="right">
      <div id="map"></div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <script>
    const btnGet = document.getElementById('btnGet');
    const btnWatch = document.getElementById('btnWatch');
    const btnStop = document.getElementById('btnStop');
    const result = document.getElementById('result');

    let watchId = null;
    let map, marker, circle;

    function initMap() {
      map = L.map('map').setView([55.76, 37.64], 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);
    }
    initMap();

    function showOnMap(lat, lon, acc) {
      const point = [lat, lon];
      if (!marker) marker = L.marker(point).addTo(map);
      else marker.setLatLng(point);

      if (!circle) circle = L.circle(point, { radius: acc, color: "#2563eb", opacity: 0.3 }).addTo(map);
      else {
        circle.setLatLng(point);
        circle.setRadius(acc);
      }

      map.setView(point, 15);
    }

    function format(pos) {
      const c = pos.coords;
      return `📌 Координаты:
Широта: ${c.latitude}
Долгота: ${c.longitude}
Точность: ±${Math.round(c.accuracy)} м
Время: ${new Date(pos.timestamp).toLocaleString()}`;
    }

    btnGet.addEventListener("click", () => {
      if (!navigator.geolocation) return result.textContent = "Геолокация не поддерживается.";

      result.textContent = "⏳ Запрашиваем...";
      navigator.geolocation.getCurrentPosition(
        pos => {
          result.textContent = format(pos);
          showOnMap(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        },
        err => result.textContent = `Ошибка: ${err.message}`,
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });

    btnWatch.addEventListener("click", () => {
      if (watchId !== null) return;

      result.textContent = "▶ Начинаем наблюдение...";
      watchId = navigator.geolocation.watchPosition(
        pos => {
          result.textContent = "🔄 Обновлено:\n" + format(pos);
          showOnMap(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
          btnStop.disabled = false;
        },
        err => result.textContent = `Ошибка наблюдения: ${err.message}`,
        { enableHighAccuracy: true }
      );

      btnWatch.disabled = true;
    });

    btnStop.addEventListener("click", () => {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      result.textContent = "⛔ Наблюдение остановлено.";
      btnWatch.disabled = false;
      btnStop.disabled = true;
    });
  </script>
</body>
</html>
